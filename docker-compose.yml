version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db_ia
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_ia_mti
      POSTGRES_DB: ia_vector_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ia
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  postgres_data:
