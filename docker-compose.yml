services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db_ia
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_ia_mti
      POSTGRES_DB: ia_vector_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ia
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: Dockerfile  # Caminho relativo, não use absoluto!
    container_name: ia_api
    # Para desenvolvimento, use --reload (hot reload)
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app/IA-MARKDOWN  # Caminho relativo, compatível com Windows/Linux/Mac
    ports:
      - "8000:8000"
    env_file:
      - .env  # Centraliza todas as variáveis sensíveis
    depends_on:
      - db
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak_ia
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass
    command: start-dev
    depends_on:
      - db

volumes:
  postgres_data:

